<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="mech-title mech-desc">
  <title id="mech-title">房间之间怎么联动：环境通道一回合结算管线</title>
  <desc id="mech-desc">六个阶段：排放、传导、吸收、反应配方、衰减、周期事件；下方是五条通道及其传导比例，以及一个真实的爆燃连携例子。</desc>

  <defs>
    <pattern id="mech-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="560" rx="26" fill="#12121a"/>
  <rect width="1200" height="560" rx="26" fill="url(#mech-grid)"/>
  <rect x="1" y="1" width="1198" height="558" rx="25" fill="none" stroke="#2a2a3e" stroke-width="1.5"/>

  <text x="64" y="82" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="#e6e6f0">房间之间怎么联动</text>
  <text x="64" y="118" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="19" fill="#a0a0b8">环境通道每回合只结算一跳：高值 → 低值，经门传导；满足条件就触发配方。</text>

  <!-- six pipeline stages -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif">
    <g>
      <rect x="70" y="150" width="150" height="150" rx="12" fill="#1e1e2e" stroke="#2e2e44"/>
      <text x="88" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#89b4fa">01</text>
      <text x="88" y="222" font-size="21" font-weight="700" fill="#e6e6f0">排放</text>
      <text x="88" y="252" font-size="19" fill="#a0a0b8">房间发射器</text>
      <circle cx="94" cy="270" r="5" fill="#ff6b4a"/>
      <text x="106" y="276" font-size="19" fill="#a0a0b8">熔炉 +250</text>
    </g>
    <g>
      <rect x="252" y="150" width="150" height="150" rx="12" fill="#1e1e2e" stroke="#2e2e44"/>
      <text x="270" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#89b4fa">02</text>
      <text x="270" y="222" font-size="21" font-weight="700" fill="#e6e6f0">传导</text>
      <text x="270" y="252" font-size="19" fill="#a0a0b8">高值 → 低值</text>
      <text x="270" y="276" font-size="19" fill="#a0a0b8">经门一跳</text>
    </g>
    <g>
      <rect x="434" y="150" width="150" height="150" rx="12" fill="#1e1e2e" stroke="#2e2e44"/>
      <text x="452" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#89b4fa">03</text>
      <text x="452" y="222" font-size="21" font-weight="700" fill="#e6e6f0">吸收</text>
      <text x="452" y="252" font-size="19" fill="#a0a0b8">冰霜吸热</text>
      <text x="452" y="276" font-size="19" fill="#a0a0b8">蓄能吸能</text>
    </g>
    <g>
      <rect x="616" y="150" width="150" height="150" rx="12" fill="#1e1e2e" stroke="#2e2e44"/>
      <text x="634" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#89b4fa">04</text>
      <text x="634" y="222" font-size="21" font-weight="700" fill="#e6e6f0">反应</text>
      <text x="634" y="252" font-size="19" fill="#a0a0b8">爆燃 / 相消</text>
      <text x="634" y="276" font-size="19" fill="#a0a0b8">充能释放</text>
    </g>
    <g>
      <rect x="798" y="150" width="150" height="150" rx="12" fill="#1e1e2e" stroke="#2e2e44"/>
      <text x="816" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#89b4fa">05</text>
      <text x="816" y="222" font-size="21" font-weight="700" fill="#e6e6f0">衰减</text>
      <text x="816" y="252" font-size="19" fill="#a0a0b8">环境场回落</text>
      <text x="816" y="276" font-size="19" fill="#a0a0b8">CHARGE 守恒</text>
    </g>
    <g>
      <rect x="980" y="150" width="150" height="150" rx="12" fill="#1e1e2e" stroke="#2e2e44"/>
      <text x="998" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#89b4fa">06</text>
      <text x="998" y="222" font-size="21" font-weight="700" fill="#e6e6f0">周期事件</text>
      <text x="998" y="252" font-size="19" fill="#a0a0b8">箭塔 / 回声</text>
      <text x="998" y="276" font-size="19" fill="#a0a0b8">Boss 能力</text>
    </g>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="24" fill="#3f3f5a" text-anchor="middle">
    <text x="236" y="233">›</text>
    <text x="418" y="233">›</text>
    <text x="600" y="233">›</text>
    <text x="782" y="233">›</text>
    <text x="964" y="233">›</text>
  </g>

  <!-- channels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g>
      <rect x="70" y="330" width="200" height="54" rx="10" fill="#1e1e2e" stroke="#2e2e44"/>
      <circle cx="94" cy="357" r="6" fill="#ff6b4a"/>
      <text x="110" y="364" font-size="19" fill="#e6e6f0">HEAT</text>
      <text x="252" y="364" font-size="20" font-weight="700" fill="#ff6b4a" text-anchor="end">40%</text>
    </g>
    <g>
      <rect x="285" y="330" width="200" height="54" rx="10" fill="#1e1e2e" stroke="#2e2e44"/>
      <circle cx="309" cy="357" r="6" fill="#7bdc5a"/>
      <text x="325" y="364" font-size="19" fill="#e6e6f0">TOXIN</text>
      <text x="467" y="364" font-size="20" font-weight="700" fill="#7bdc5a" text-anchor="end">50%</text>
    </g>
    <g>
      <rect x="500" y="330" width="200" height="54" rx="10" fill="#1e1e2e" stroke="#2e2e44"/>
      <circle cx="524" cy="357" r="6" fill="#6cc7ff"/>
      <text x="540" y="364" font-size="19" fill="#e6e6f0">COLD</text>
      <text x="682" y="364" font-size="20" font-weight="700" fill="#6cc7ff" text-anchor="end">40%</text>
    </g>
    <g>
      <rect x="715" y="330" width="200" height="54" rx="10" fill="#1e1e2e" stroke="#2e2e44"/>
      <circle cx="739" cy="357" r="6" fill="#ffd93d"/>
      <text x="755" y="364" font-size="19" fill="#e6e6f0">CHARGE</text>
      <text x="897" y="364" font-size="20" font-weight="700" fill="#ffd93d" text-anchor="end">50%</text>
    </g>
    <g>
      <rect x="930" y="330" width="200" height="54" rx="10" fill="#1e1e2e" stroke="#2e2e44"/>
      <circle cx="954" cy="357" r="6" fill="#cdcdf0"/>
      <text x="970" y="364" font-size="19" fill="#e6e6f0">AIRFLOW</text>
      <text x="1112" y="364" font-size="20" font-weight="700" fill="#cdcdf0" text-anchor="end">25%</text>
    </g>
  </g>

  <!-- worked example -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif">
    <rect x="70" y="406" width="1060" height="120" rx="12" fill="#161622" stroke="#2e2e44"/>
    <text x="94" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#89b4fa">EXAMPLE · 爆燃（真实配方数据）</text>
    <text x="94" y="474" font-size="21" font-weight="600" fill="#e6e6f0">熔炉房 HEAT 600 ＋ 毒雾房 TOXIN 300 → 触发爆燃</text>
    <text x="94" y="504" font-size="19" fill="#a0a0b8">TOXIN −500 · 燃烧 2 回合 · 火焰波 ≤4 房间 · 镜面房把波转向 90° · 全定点整数，事件日志可回放</text>
  </g>
</svg>
