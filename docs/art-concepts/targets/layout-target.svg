<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">M6 像素运行层布局：1280×800 的屏幕分区</title>
  <desc>顶部状态条 64、左侧 5×5 宏观地图 256、中央 9×9 房间 576（64px 格）、右侧单位/通道面板 240、底部按键提示 64；房间内部以 16px 坐标 ×4 整数缩放。</desc>

  <defs>
    <pattern id="roomgrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#12121a"/>
      <path d="M64 0H0V64" fill="none" stroke="#89b4fa" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <pattern id="maingrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#171722"/>
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="#0b0b10"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1280" height="64" fill="#141420"/>
  <rect x="0" y="62" width="1280" height="2" fill="#2a2a3e"/>
  <text x="24" y="40" font-family="-apple-system, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#e6e6f0">折叠地牢</text>
  <text x="128" y="39" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#8f8fa8">FOLDED DUNGEON</text>
  <text x="640" y="39" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1" fill="#e8c15a">FLOOR 1/1 · ROUND 2 · 战斗</text>
  <text x="1256" y="39" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#e6e6f0">GOLD 15   BP 9   HP 16/16</text>
  <text x="24" y="82" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5c5c78">TOP BAR · 64px · 楼层 / 金币 / 构筑点 / 回合 / HP</text>

  <!-- left sidebar -->
  <rect x="16" y="100" width="256" height="620" rx="4" fill="#0f0f18" stroke="#2a2a3e"/>
  <text x="40" y="132" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="3" fill="#8f8fa8">MACRO GRID · 5×5</text>
  <rect x="40" y="148" width="208" height="208" fill="url(#maingrid)" stroke="#2a2a3e"/>
  <!-- sample rooms -->
  <rect x="80" y="188" width="40" height="40" fill="#1b2b3d" stroke="#89b4fa" stroke-width="2"/>
  <rect x="120" y="148" width="40" height="40" fill="#262636" stroke="#44445e"/>
  <rect x="40" y="188" width="40" height="40" fill="#262636" stroke="#44445e"/>
  <rect x="120" y="228" width="40" height="40" fill="#262636" stroke="#44445e"/>
  <rect x="160" y="188" width="40" height="40" fill="#262636" stroke="#44445e"/>
  <rect x="80" y="148" width="40" height="40" fill="#262636" stroke="#44445e"/>
  <g fill="#c9a227">
    <rect x="118" y="206" width="6" height="8" rx="1"/>
    <rect x="78" y="206" width="6" height="8" rx="1"/>
    <rect x="158" y="206" width="6" height="8" rx="1"/>
    <rect x="96" y="186" width="8" height="6" rx="1"/>
    <rect x="96" y="226" width="8" height="6" rx="1"/>
  </g>
  <text x="24" y="400" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5c5c78">SIDEBAR · 256px · 地图 / 资源 / 通道图例</text>
  <text x="40" y="434" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#8f8fa8">RUN</text>
  <text x="40" y="462" font-family="-apple-system, PingFang SC, sans-serif" font-size="15" fill="#e6e6f0">金币 15 · 构筑点 9</text>
  <text x="40" y="490" font-family="-apple-system, PingFang SC, sans-serif" font-size="15" fill="#e6e6f0">回合 2 · 战斗</text>
  <text x="40" y="534" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#8f8fa8">CHANNELS</text>
  <g font-family="-apple-system, PingFang SC, sans-serif" font-size="14">
    <circle cx="48" cy="562" r="5" fill="#ff6b4a"/><text x="62" y="567" fill="#e6e6f0">热量 600</text>
    <circle cx="48" cy="592" r="5" fill="#7bdc5a"/><text x="62" y="597" fill="#e6e6f0">毒雾 200</text>
    <circle cx="48" cy="622" r="5" fill="#6cc7ff"/><text x="62" y="627" fill="#e6e6f0">寒冷 0</text>
    <circle cx="48" cy="652" r="5" fill="#ffd93d"/><text x="62" y="657" fill="#e6e6f0">能量 0</text>
    <circle cx="48" cy="682" r="5" fill="#cdcdf0"/><text x="62" y="687" fill="#e6e6f0">气流 0</text>
  </g>

  <!-- room -->
  <rect x="368" y="112" width="576" height="576" fill="url(#roomgrid)" stroke="#89b4fa" stroke-opacity="0.55" stroke-width="2"/>
  <text x="656" y="100" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#89b4fa">ROOM VIEW · 9×9 · 64px tile = 576px（内部 16px × 4 缩放）</text>
  <!-- unit markers -->
  <circle cx="656" cy="400" r="13" fill="#89b4fa"/>
  <circle cx="656" cy="400" r="19" fill="none" stroke="#89b4fa" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="784" cy="272" r="13" fill="#e05555"/>
  <circle cx="720" cy="400" r="13" fill="#e05555"/>
  <circle cx="848" cy="208" r="13" fill="#7bdc5a" opacity="0.35"/>
  <text x="368" y="716" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5c5c78">ROOM AREA · 9×9 tiles · doors on wall midpoints · Y-sort units / props</text>

  <!-- right panel -->
  <rect x="1024" y="112" width="240" height="576" rx="4" fill="#0f0f18" stroke="#2a2a3e"/>
  <text x="1044" y="144" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#8f8fa8">UNITS</text>
  <g font-family="-apple-system, PingFang SC, sans-serif" font-size="14" fill="#e6e6f0">
    <circle cx="1052" cy="176" r="5" fill="#89b4fa"/><text x="1066" y="181">玩家 16/16</text>
    <circle cx="1052" cy="208" r="5" fill="#e05555"/><text x="1066" y="213">怪物 A 4/4</text>
    <circle cx="1052" cy="240" r="5" fill="#e05555"/><text x="1066" y="245">怪物 B 4/4</text>
  </g>
  <rect x="1044" y="270" width="200" height="1" fill="#2a2a3e"/>
  <text x="1044" y="300" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#8f8fa8">INTENT</text>
  <text x="1044" y="330" font-family="-apple-system, PingFang SC, sans-serif" font-size="14" fill="#e6e6f0">怪物靠近 · 下回合攻击</text>
  <text x="1044" y="356" font-family="-apple-system, PingFang SC, sans-serif" font-size="14" fill="#7bdc5a">毒雾 200 将持续扩散</text>
  <rect x="1044" y="388" width="200" height="1" fill="#2a2a3e"/>
  <text x="1044" y="418" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#8f8fa8">QUEST</text>
  <text x="1044" y="446" font-family="-apple-system, PingFang SC, sans-serif" font-size="14" fill="#e6e6f0">清空本层 7 个槽位</text>
  <text x="1044" y="472" font-family="-apple-system, PingFang SC, sans-serif" font-size="14" fill="#e6e6f0">击败 Boss</text>
  <text x="1024" y="712" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5c5c78">RIGHT PANEL · 240px</text>

  <!-- bottom bar -->
  <rect x="0" y="736" width="1280" height="64" fill="#141420"/>
  <rect x="0" y="736" width="1280" height="2" fill="#2a2a3e"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#8f8fa8">
    <text x="24" y="774">WASD 移动</text>
    <text x="160" y="774">SPACE 攻击</text>
    <text x="296" y="774">ENTER 结束回合</text>
    <text x="472" y="774">ESC 菜单</text>
  </g>
  <text x="1256" y="774" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5c5c78">BOTTOM BAR · 64px · 按键提示 / 提示信息</text>

  <!-- side gutter notes -->
  <text x="304" y="760" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5c5c78">GAP 32</text>
  <text x="960" y="100" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5c5c78">GAP 48</text>
</svg>
